id = "ai.quicktui"
name = "QuickTUI"
version = "server2-20261002-01"
min_herdr_version = "0.8.0"
description = "Discover QuickTUI Server and open the official pairing flow from Herdr."
platforms = ["linux", "macos"]

[[startup]]
command = ["./scripts/startup.sh"]

[[actions]]
id = "setup"
title = "QuickTUI Setup"
description = "Open the QuickTUI setup pane and official pairing welcome guide."
contexts = ["workspace", "global"]
command = ["./scripts/open-pane.sh", "setup"]

[[actions]]
id = "pair-qrcode"
title = "QuickTUI Pairing QR"
description = "Open a pane with the official QuickTUI pairing QR code when the server is ready."
contexts = ["workspace", "global"]
command = ["./scripts/open-pane.sh", "pair-qrcode"]

[[panes]]
id = "setup"
title = "QuickTUI Setup"
description = "Interactive QuickTUI setup and pairing entry."
placement = "popup"
width = "80%"
height = 24
command = ["./scripts/setup.sh"]

[[panes]]
id = "pair-qrcode"
title = "QuickTUI Pairing QR"
description = "Official QuickTUI pairing QR code."
placement = "popup"
width = "80%"
height = 24
command = ["./scripts/pair-qrcode.sh"]
